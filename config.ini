# dc-libavmpeg runtime settings (read by dc-libavmpeg-av.elf; no rebuild needed).
# kos-tool cannot pass arguments, so change the clip here. Lines starting with
# # or ; are comments.

# Clip name: looked up in /cd/ then /pc/fixtures/ via the BBA file service.
#   lair_320_23976_30s_spec.mpg         mono   (2D primary gate)
#   lair_320_23976_30s_stereo_spec.mpg  stereo (2E: L = speech, R = 1 kHz beeps)
fixture=lair_320_23976_30s_spec.mpg

# Positive delays video relative to audio (microseconds).
sync_offset_us=0

# Stereo diagnostic: "split" (default, KOS deinterleaves) or "direct" (our own
# L/R deinterleave straight into the AICA buffers, no snd_pcm16_split).
audio_path=split
